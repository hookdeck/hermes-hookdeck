[project]
name = "hermes-hookdeck"
version = "0.1.0"
description = "Hookdeck event gateway plugin for Hermes Agent — verified, queued, retryable webhook triggers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # Both are already Hermes dependencies; listed so the plugin can be
    # installed and tested standalone.
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools]
packages = ["hookdeck"]
