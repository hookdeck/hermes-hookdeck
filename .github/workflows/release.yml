# Release-driven publish to PyPI.
#
#   1. get everything you want released onto `main`
#   2. bump `__version__` in hookdeck/__init__.py (pyproject reads it from there)
#   3. publish a GitHub release whose tag is v<that version>, targeting main
#
# Publishing the release is the decision to ship — there is no second approval
# step. `skills/hermes-hookdeck-release` walks an agent through it; the human
# version is in README.md § Releasing.
#
# The tag is created by the release, so nothing here pushes tags. A release
# whose tag disagrees with `hookdeck.__version__` fails before anything is
# uploaded.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# the repository to leak or rotate. It needs a one-time setup on PyPI:
# Project → Publishing → add a GitHub publisher for hookdeck/hermes-hookdeck,
# workflow `release.yml`, environment `pypi`.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release can target any commit. Build the one it actually points
          # at, not the tip of the default branch.
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' build twine

      - name: The release tag and the package version must agree
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          tagged="${TAG#v}"
          declared=$(python -c 'import hookdeck; print(hookdeck.__version__)')
          if [ "$tagged" != "$declared" ]; then
            echo "::error::release $TAG does not match hookdeck.__version__ ($declared)."
            echo "::error::Delete the release and its tag, fix the version on main, and publish again."
            exit 1
          fi
          echo "✓ releasing $declared"

      # A release that cannot pass its own test suite is not a release.
      - run: ruff check .
      - run: python -m pytest -q

      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-hookdeck
    permissions:
      # The OIDC token pypa/gh-action-pypi-publish exchanges for an upload
      # token. Nothing else in this workflow needs it, which is why it is
      # scoped to this job rather than the file.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-artifacts:
    # The human created the release, so it has notes but no files. Attach the
    # exact artifacts that went to PyPI, so the GitHub release is not a
    # description of a build nobody can see.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
