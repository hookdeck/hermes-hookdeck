# Release-driven publish to PyPI.
#
#   1. get everything you want released onto `main`
#   2. publish a GitHub release, targeting main, tagged vMAJOR.MINOR.PATCH
#
# The tag is the version: setuptools-scm derives it, so there is nothing in the
# repo to bump and nothing that can disagree with the tag.
#
# Publishing the release is the decision to ship — there is no second approval
# step. `skills/hermes-hookdeck-release` walks an agent through it; the human
# version is in README.md § Releasing.
#
# The tag is created by the release, so nothing here pushes tags.
#
# Publishing uses PyPI Trusted Publishing (OIDC), so there is no API token in
# the repository to leak or rotate. It needs a one-time setup on PyPI:
# Project → Publishing → add a GitHub publisher for hookdeck/hermes-hookdeck,
# workflow `release.yml`, environment `pypi`.
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A release can target any commit. Build the one it actually points
          # at, not the tip of the default branch.
          ref: ${{ github.event.release.tag_name }}
          # setuptools-scm derives the version from the tag, so the tag has to
          # be in the clone. A shallow checkout builds 0.1.dev1+g<sha>.
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]' build twine

      - name: Show the version the tag resolves to
        run: |
          set -euo pipefail
          echo "✓ releasing $(python -c 'import hookdeck; print(hookdeck.__version__)')"

      # A release that cannot pass its own test suite is not a release.
      - run: ruff check .
      - run: python -m pytest -q

      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/hermes-hookdeck
    permissions:
      # The OIDC token pypa/gh-action-pypi-publish exchanges for an upload
      # token. Nothing else in this workflow needs it, which is why it is
      # scoped to this job rather than the file.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  attach-artifacts:
    # The human created the release, so it has notes but no files. Attach the
    # exact artifacts that went to PyPI, so the GitHub release is not a
    # description of a build nobody can see.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
